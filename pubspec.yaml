name: fast
description: "FAST - Faculty of Applied Sciences & Technology App"
publish_to: 'none'
version: 1.1.0+110
environment:
  sdk: '>=3.7.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  
  # UI & Icons
  cupertino_icons: ^1.0.8
  
  # Firebase dependencies (your existing versions)
  firebase_core: ^3.6.0  # Latest as of April 2025
  firebase_auth: ^5.3.1  # Latest as of April 2025
  cloud_firestore: ^5.4.4  # Latest as of April 2025
  firebase_storage: ^12.3.2  # Latest as of April 2025
  firebase_app_check: ^0.3.1  # Latest as of April 2025
  firebase_messaging: 15.2.5
  cloudinary_public: ^0.21.0
  
  # State Management & Architecture
  provider: ^6.1.2
  
  # Network & Image Handling (CRITICAL ADDITIONS FOR PRODUCTION)
  cached_network_image: ^3.3.1  # Essential for production network images
  http: ^1.2.0  # For better network performance
  
  # Media & File Handling
  image_picker: ^1.1.2
  
  # System Integration
  url_launcher: ^6.3.0
  share_plus: ^7.2.2
  webview_flutter: ^4.4.2
  
  # Notifications & Permissions
  flutter_local_notifications: ^17.1.2
  permission_handler: ^11.3.1
  
  # Utilities
  logging: ^1.2.0
  web: ^1.1.1
  
  # Additional Production Recommendations
  connectivity_plus: ^5.0.2  # Network connectivity monitoring
  package_info_plus: ^4.2.0  # App version and build info
  device_info_plus: ^9.1.2  # Device information for analytics/debugging

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1  # For app icon management

dependency_overrides:
  # Remove the firebase override unless necessary
  # firebase: ^9.1.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/MUST_LOGO.png
    - assets/images/MUST.jpg
    - assets/images/home/
    - assets/images/quick_links/

# Flutter launcher icons configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/MUST.jpg"  # Path to the MUST logo
  min_sdk_android: 21  # Optional, default is 16
  # Optional: For Android adaptive icons
  adaptive_icon_background: "#FFFFFF"  # Background color
  # adaptive_icon_foreground: "assets/images/must_logo_foreground.png"  # Uncomment if you have a separate foreground image import 
